<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Etch-a-Sketch</h1>
        <p>Desenha ao passar o rato pela grelha.</p>
    </header>

    <main>
        <div class="controls">
            <button id="resize-button">Alterar grelha</button>
            <button id="clear-button">Limpar desenho</button>
        </div>

        <div id="grid-container"></div>
    </main>

    <footer>
        <p>Projeto desenvolvido com HTML, CSS e JavaScript.</p>
    </footer>
</body>
</html>
